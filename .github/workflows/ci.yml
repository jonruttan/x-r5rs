name: CI

# THE MATRIX IS THE POINT.  The 2024 generation of these langs had
# genuinely good spec suites that nothing ever ran once they left the x-lang
# tree, and that is the whole of why they rotted -- not the missing digests,
# not the path literals on their own.  A lang without its suite in its
# own CI is the last generation with a fresh coat of paint.
#
# TWO RELEASES, DELIBERATELY.  A bundle names the x-lang it was built against
# in lang.xon's (requires-release ...); the matrix runs that one AND
# whatever main is now.  The pairing row is what turns "the platform moved
# underneath us" from something discovered years later into a red build on the
# day it happens.  The `main` leg is allowed to fail -- it is an early warning
# about the platform, not a verdict on this bundle.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because the interesting failure here is one nothing in this
  # repository triggers: x-lang moving while this bundle sits still.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # THE MATRIX IS READ, NOT WRITTEN.  The pinned leg used to be a literal kept
  # equal to lang.xon by a check further down -- two copies of one fact, with a
  # gate to catch the drift between them.  Deriving it removes the second copy
  # instead of guarding it, which is the same ruling tools/check/release-refs.sh
  # applies to every other place this release is named.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      - id: legs
        name: Read the declared release from lang.xon
        run: |
          declared=$(sed -n 's/^(requires-release "\(.*\)")$/\1/p' lang.xon)
          if [ -z "$declared" ]; then
            echo "lang.xon declares no (requires-release ...)" >&2
            exit 1
          fi
          echo "legs=[\"$declared\", \"main\"]" >> "$GITHUB_OUTPUT"
          echo "matrix: $declared and main"

  specs:
    needs: prepare
    name: specs @ x-lang ${{ matrix.x-lang }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.x-lang == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        # BOTH LEGS, AND THEY ANSWER DIFFERENT QUESTIONS.  The pinned leg
        # proves this bundle still runs on the platform it DECLARES; the main
        # leg is an early warning that x-lang has moved underneath it, and is
        # allowed to fail.  The pinned row comes from lang.xon via `prepare`,
        # so it cannot disagree with the manifest -- there is nothing here to
        # keep in sync.
        x-lang: ${{ fromJSON(needs.prepare.outputs.legs) }}

    steps:
      - uses: actions/checkout@v4

      - name: Check out x-lang
        uses: actions/checkout@v4
        with:
          repository: jonruttan/x-lang
          ref: ${{ matrix.x-lang }}
          path: .x-lang


      # The engine is acquired, not built: x-lang pins one and knows how to
      # fetch it.  Nothing here reimplements that.
      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine      # acquire the pinned engine
          make             # x-bin at the repo root -- `make engine` does not build it
          make boot        # the launcher-free amalgams the harness loads

      # THE GATE IS spec-gate, NOT spec-runner.  The runner exits non-zero on
      # any failure, which is right at a prompt and wrong here: this bundle
      # carries documented debt (the ellipsis group), so the raw runner makes
      # it permanently red and the signal stops meaning anything.  The gate
      # compares the failing test NAMES against
      # tests/contract/known-failures.txt and is red when they differ in
      # EITHER direction -- a new failure, or a recorded one that now passes.
      - name: Run the R5RS specs
        run: X="$PWD/.x-lang/x.sh" sh tests/spec-gate.sh

  relocatable:
    # THE RULE THAT ACTUALLY KILLED THE LAST GENERATION, as a gate -- and it
    # is stricter now than the contract requires.  The contract exempts an app
    # ENTRY, because an in-tree app self-boots.  A bundle does not: x.sh boots
    # the dialect lang.xon declares and arms this root before run.x is read, so
    # ZERO files here need a root-relative literal, run.x included.  A bundle
    # that grows one is nailed to the directory it was written in, and the
    # symptom does not appear until someone moves it -- which is to say, never
    # in the repository where it was developed.
    name: no path literals at all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The declared release is named once
        run: sh tools/check/release-refs.sh

      - name: No path literals outside run.x
        run: |
          # Match the entry however grep spells its path (./run.x or run.x),
          # and ignore COMMENTS -- a file may legitimately quote the literal it
          # no longer uses, which is exactly what a port's notes do.
          hits=$(grep -rn '(include "[a-zA-Z]' --include='*.x' . \
                 | grep -Ev ':[0-9]+:[[:space:]]*;' || true)
          if [ -n "$hits" ]; then
            echo "root-relative include (a bundle needs none, not even in run.x):" >&2
            echo "$hits" >&2
            exit 1
          fi
      - name: The generated harness is not committed
        run: |
          if [ -e tests/lib/harness.gen.x ]; then
            echo "tests/lib/harness.gen.x is generated and machine-specific;" >&2
            echo "it must not be committed (see .gitignore)" >&2
            exit 1
          fi
