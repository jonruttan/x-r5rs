name: CI

# The bundle CI the platform ships, in x-lang's .github/workflows/bundle.yml:
# the suite against the release lang.xon declares, and against x-lang main on
# a push to main, the weekly schedule and a manual dispatch.  The suite runs
# on Ubuntu only, as it did before it moved there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, because x-lang can move while this repository sits still.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  ci:
    uses: jonruttan/x-lang/.github/workflows/bundle.yml@main
    with:
      os: '["ubuntu-24.04"]'
      # One spec file per process: a hosted runner has too little memory for
      # a batch, whose garbage stays until the process exits.
      spec-env: SPEC_BATCH=1

  if-ladders:
    # `match` is the primitive; a decision with four or more arms written as
    # nested ifs says the same thing one indent deeper per arm. This is a
    # ratchet over tools/contract/if-ladders.txt (currently empty): a new
    # ladder fails here rather than in review. No runtime needed -- the checker
    # parses the modules and never evaluates them -- so it runs against x-lang
    # main, borrowing the platform only as a parser.
    name: if ladders are match
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out x-lang
        uses: actions/checkout@v7
        with:
          repository: jonruttan/x-lang
          ref: main
          path: .x-lang
      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine
          make
          make boot
      - name: No new if ladders
        run: X="$PWD/.x-lang/x.sh" sh tools/check/if-ladders.sh

  release-refs:
    # The kit ships with the platform, so this job needs x-lang present -- a
    # shallow checkout of the release lang.xon declares, not a build. The
    # check reads lang.xon and greps the tree, so X_LANG_KIT points straight
    # at the kit rather than going through `x --share-dir`.
    name: the declared versions are named once
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check out the lang kit
        run: |
          declared=$(sed -n 's/^(requires-release "\(.*\)")$/\1/p' lang.xon)
          git clone --depth 1 --branch "$declared" \
            https://github.com/jonruttan/x-lang.git .x-lang
      - name: The declared versions are named once
        env:
          X_LANG_KIT: ${{ github.workspace }}/.x-lang/tools/lang-kit
        run: sh tools/check/release-refs.sh
